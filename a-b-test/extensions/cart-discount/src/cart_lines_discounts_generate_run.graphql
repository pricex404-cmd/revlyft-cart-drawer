query CartInput {
  cart {
    lines {
      id
      quantity
      merchandise {
        ... on ProductVariant {
          id
          title
        }
      }
      cost {
        subtotalAmount {
          amount
        }
      }
    }
    # Individual cart attributes for A/B Test IDs
    deviceIdAttribute: attribute(key: "abtest_device_id") {
      value
    }
    hashValueAttribute: attribute(key: "abtest_hash_value") {
      value
    }
    testDataAttribute: attribute(key: "abtest_test_data") {
      value
    }
    testTimerAttribute: attribute(key: "causal_funnel_test_timer") {
      value
    }
    # Current time from frontend
    currentTimeAttribute: attribute(key: "causal_funnel_current_time") {
      value
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app:cart-discount", key: "function-configuration") {
      value
    }
  }
}
